<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BookNest — Create staff account</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="logo-row">
          <div class="logo">BookNest</div>
          <button class="theme-toggle" type="button" aria-label="Toggle theme">☼</button>
        </div>
        <nav class="nav" aria-label="Administrator navigation">
          <a href="administrator.html">Dashboard overview</a>
          <a href="administrator-rules.html">Library rules</a>
          <a href="administrator-staff.html" class="active">Create staff account</a>
          <a href="administrator-users.html">User accounts and roles</a>
        </nav>
        <nav class="nav nav-small" aria-label="Utility links">
          <a href="login.html" data-logout>Logout</a>
        </nav>
      </aside>
      <main class="content">
        <div class="panel">
          <div class="inner-panel">
            <div class="frame-title"><span class="badge">+</span> Create staff account</div>
            <form class="form-box role-form" id="staff-form">
              <div class="role-form-grid">
                <div class="field"><label for="staff-name">Full name</label><input id="staff-name" maxlength="120" required /></div>
                <div class="field"><label for="staff-email">Email</label><input id="staff-email" type="email" maxlength="190" required /></div>
                <div class="field"><label for="staff-password">Temporary password</label><input id="staff-password" type="password" minlength="8" maxlength="72" required /></div>
                <div class="field"><label for="staff-role">Role</label><select id="staff-role"><option value="librarian">Librarian</option><option value="administrator">Administrator</option></select></div>
              </div>
              <div class="form-actions"><button class="btn primary" type="submit">Create staff account</button></div>
              <p class="form-notice" id="staff-notice" role="status" hidden></p>
            </form>
          </div>
        </div>
      </main>
    </div>
    <script src="script.js"></script>
  </body>
</html>
