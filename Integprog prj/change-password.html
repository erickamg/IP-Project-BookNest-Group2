<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BookNest — Change password</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="logo-row">
          <div class="logo">BookNest</div>
          <button class="theme-toggle" type="button" aria-label="Toggle theme">☼</button>
        </div>
        <nav class="nav" aria-label="Sidebar navigation">
          <a href="index.html">Dashboard</a>
          <a href="browse.html">Browse Books</a>
          <a href="my-books.html">My Borrowed</a>
          <a href="history.html">Borrowing History</a>
          <a href="profile.html" class="active">Profile</a>
        </nav>
        <nav class="nav nav-small" aria-label="Utility links">
          <a href="login.html" data-logout>Logout</a>
        </nav>
      </aside>

      <main class="content">
        <div class="panel form-panel">
          <div class="frame-title"><span class="badge">✎</span> Change password</div>
          <form class="form-box" id="change-password-form">
            <div class="field">
              <label for="current-password">Current password</label>
              <input id="current-password" name="currentPassword" type="password" autocomplete="current-password" required />
            </div>
            <div class="field">
              <label for="new-password">New password</label>
              <input id="new-password" name="newPassword" type="password" minlength="8" maxlength="72" autocomplete="new-password" required />
            </div>
            <div class="field">
              <label for="confirm-password">Confirm new password</label>
              <input id="confirm-password" name="confirmPassword" type="password" minlength="8" maxlength="72" autocomplete="new-password" required />
            </div>
            <div class="form-actions">
              <a class="btn" href="profile.html">Cancel</a>
              <button class="btn primary" type="submit">Update password</button>
            </div>
            <p class="form-notice" id="password-notice" role="status" aria-live="polite" hidden></p>
          </form>
        </div>
      </main>
    </div>
    <script src="script.js"></script>
  </body>
</html>
