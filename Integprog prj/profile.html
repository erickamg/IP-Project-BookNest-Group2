<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BookNest — Profile</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="logo-row">
          <div class="logo">BookNest</div>
          <button class="theme-toggle" type="button" aria-label="Toggle theme">☼</button>
        </div>

        <nav class="nav" aria-label="Sidebar navigation">
          <a href="index.html">Dashboard</a>
          <a href="browse.html">Browse Books</a>
          <a href="my-books.html">My Borrowed</a>
          <a href="history.html">Borrowing History</a>
          <a href="profile.html" class="active">Profile</a>
        </nav>

        <nav class="nav nav-small" aria-label="Utility links">
          <a href="index.html">Logout</a>
        </nav>
      </aside>

      <main class="content">
        <div class="panel form-panel">
          <div class="frame-title"><span class="badge">✎</span> Profile</div>
          <div class="form-box">
            <div class="field">
              <label>Full name</label>
              <input type="text" value="" placeholder="Student full name" />
            </div>
            <div class="field">
              <label>Email</label>
              <input type="email" value="" placeholder="student@email.com" />
            </div>
            <div class="field">
              <label>Phone</label>
              <input type="text" value="" placeholder="Add phone number" />
            </div>
            <div class="field">
              <label>Change password</label>
              <input type="password" value="" placeholder="Enter a new password" />
            </div>

            <div class="form-actions">
              <button class="btn">Cancel</button>
              <button class="btn primary">Save changes</button>
            </div>
          </div>
        </div>

        <div class="panel form-panel">
          <div class="empty-state">
            <div>
              <div class="icon"></div>
              <div style="font-size: 1rem; font-weight: 700; color: var(--text);">No records yet</div>
              <div style="margin-top: 8px;">Your account details will appear here.</div>
              <button class="btn" style="margin-top: 12px;">Refresh</button>
            </div>
          </div>
        </div>
      </main>
    </div>
    <script src="script.js"></script>
  </body>
</html>
