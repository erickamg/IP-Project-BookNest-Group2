<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BookNest — Profile</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="logo-row">
          <div class="logo">BookNest</div>
          <button class="theme-toggle" type="button" aria-label="Toggle theme">☼</button>
        </div>

        <nav class="nav" aria-label="Sidebar navigation">
          <a href="index.html">Dashboard</a>
          <a href="browse.html">Browse Books</a>
          <a href="my-books.html">My Borrowed</a>
          <a href="history.html">Borrowing History</a>
          <a href="profile.html" class="active">Profile</a>
        </nav>

        <nav class="nav nav-small" aria-label="Utility links">
          <a href="login.html" data-logout>Logout</a>
        </nav>
      </aside>

      <main class="content">
        <div class="panel form-panel">
          <div class="frame-title"><span class="badge">✎</span> Profile</div>
          <form class="form-box" id="profile-form">
            <div class="field">
              <label for="profile-name">Full name</label>
              <input id="profile-name" name="name" type="text" value="" placeholder="Student full name" required />
            </div>
            <div class="field">
              <label for="profile-email">Email</label>
              <input id="profile-email" name="email" type="email" value="" placeholder="student@email.com" required />
            </div>
            <div class="field">
              <label for="profile-phone">Phone</label>
              <input id="profile-phone" name="phone" type="tel" value="" placeholder="Add phone number" />
            </div>
            <div class="field">
              <label for="profile-password">Change password</label>
              <input id="profile-password" name="password" type="password" value="" placeholder="Password changes are unavailable in demo mode" disabled />
            </div>

            <div class="form-actions">
              <button class="btn" type="reset">Cancel</button>
              <button class="btn primary" type="submit">Save changes</button>
            </div>
            <p class="form-notice" id="profile-notice" role="status" aria-live="polite" hidden></p>
          </form>
        </div>

        <div class="panel form-panel">
          <div class="empty-state">
            <div>
              <div class="icon"></div>
              <div style="font-size: 1rem; font-weight: 700; color: var(--text);">No records yet</div>
              <div style="margin-top: 8px;">Your account details will appear here.</div>
              <button class="btn" style="margin-top: 12px;">Refresh</button>
            </div>
          </div>
        </div>
      </main>
    </div>
    <script src="script.js"></script>
  </body>
</html>
